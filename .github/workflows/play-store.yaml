name: Build & Upload to Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# Back-to-back merges upload one after another instead of racing on the Play edit.
concurrency:
  group: play-store
  cancel-in-progress: false

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Install dependencies
        run: make install

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/deskconn-release-key.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=deskconn-release-key.jks
          EOF

      - name: Build App Bundle
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          flutter build appbundle --no-tree-shake-icons --build-number=$((BASE + ${{ github.run_number }}))

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: io.xconn.deskconn
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Notify Discord
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TRACK: ${{ inputs.track || 'internal' }}
        run: |
          BUILD=$(( $(grep '^version:' pubspec.yaml | sed 's/.*+//') + ${{ github.run_number }} ))
          CHANGE=$(git log -1 --format=%s)
          CONTENT=$(printf '**Deskconn Mobile build %s** is on the Play Store (%s track)\n**What changed:** %s\nhttps://play.google.com/store/apps/details?id=io.xconn.deskconn' "$BUILD" "$TRACK" "$CHANGE")
          jq -n --arg content "$CONTENT" '{content: $content}' | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
